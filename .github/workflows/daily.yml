name: rn-dorking daily run

on:
  schedule:
    # Cztery cron-y w minutach POZA pełną godziną - GitHub masowo opóźnia
    # i porzuca runy cronowe "na pełną godzinę" (0 * * * *), co powodowało,
    # że okna 07:00/19:00 PL w ogóle się nie uruchamiały. Pary lato/zima
    # (CEST=UTC+2, CET=UTC+1) dają 07:17 i 19:23 czasu PL przez cały rok;
    # właściwe okno wybiera krok "Decide mode" wg TZ=Europe/Warsaw.
    - cron: "17 5 * * *"    # 07:17 czasu PL latem (CEST)
    - cron: "17 6 * * *"    # 07:17 czasu PL zimą (CET)
    - cron: "23 17 * * *"   # 19:23 czasu PL latem (CEST)
    - cron: "23 18 * * *"   # 19:23 czasu PL zimą (CET)
  workflow_dispatch:        # przycisk "Run workflow" - uruchamia od razu
    inputs:
      regenerate_registry:
        description: "Odśwież rejestr BIP samorządów (data/bip_jst.json) przed skanem"
        type: boolean
        default: false
        required: false
      resolve_urls:
        description: "Uzupełnij mapowanie slug->adres BIP (wolne: DDG per podmiot)"
        type: boolean
        default: false
        required: false
  push:
    paths-ignore:           # nie odpalaj przy commitach wyników bota i docs
      - "docs/**"
      - "oferty.json"
      - "stan.json"
      - "data/**"
      - "**.md"

permissions:
  contents: write           # pozwala workflow'owi robić commit wyników

# Serializacja runów: spóźniony cron z tego samego okna nie może biec
# równolegle z innym (konflikt push przy "Commit results"); run z kolejki
# i tak wykona "Decide mode" już po poprzedniku i zwykle się pominie.
concurrency:
  group: daily-run

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Pełna historia - krok "Decide mode" datuje ostatni commit wyników
          # (git log -- <paths>), co na shallow clone zwracałoby pusto
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Regenerate JST registry (optional)
        if: inputs.regenerate_registry == true
        run: |
          python tools/fetch_bip_registry.py
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bip_jst.json
          git diff --staged --exit-code --quiet || { git commit -m "Rejestr BIP samorzadow — odswiezenie $(date +'%Y-%m-%d')"; git push; }

      - name: Resolve real BIP URLs (optional)
        if: inputs.resolve_urls == true
        run: |
          python tools/resolve_bip_urls.py
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bip_jst_urls.json
          git diff --staged --exit-code --quiet || { git commit -m "Mapowanie slug->realny BIP $(date +'%Y-%m-%d')"; git push; }

      - name: Decide mode (DST-safe, czas PL)
        id: mode
        run: |
          HOUR=$(TZ='Europe/Warsaw' date +'%H')
          echo "Godzina PL: $HOUR"
          # Okno 3-godzinne zamiast dokładnej godziny - absorbuje opóźnienia
          # kolejki GitHub Actions (runy cronowe bywają spóźnione o >30 min)
          case "$HOUR" in
            07|08|09|19|20|21) MODE=run ;;
            *) MODE=skip ;;
          esac
          # Uruchomienie ręczne i push zawsze odpalają potok od razu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             || [ "${{ github.event_name }}" = "push" ]; then MODE=run; fi
          # Wiek ostatniego commita wyników - liczony dla KAŻDEGO runu
          # schedule (także poza oknem): GitHub potrafi opóźnić cron o kilka
          # godzin; taki run ląduje poza oknem i byłby cicho pominięty mimo
          # nieświeżych danych. Wiek > 14 h = poprzednie okno nie wyprodukowało
          # danych (stale=true -> alert + run nadrobczy niezależnie od okna).
          # Wiek < 4 h = deduplikacja: spóźniony drugi cron z tego samego
          # okna (i runy zaraz po runie nadrobczym) są pomijane.
          STALE=false
          AGE_H=0
          if [ "${{ github.event_name }}" = "schedule" ]; then
            LAST_COMMIT=$(git log -1 --format=%ct -- stan.json oferty.json docs/data)
            [ -z "$LAST_COMMIT" ] && LAST_COMMIT=0
            AGE_H=$(( ($(date +%s) - LAST_COMMIT) / 3600 ))
            echo "Wyniki potoku commitowane ostatnio: $AGE_H h temu"
            if [ "$AGE_H" -gt 14 ]; then
              STALE=true
              MODE=run    # run nadrobczy: poza oknem, ale dane nieświeże
            elif [ "$AGE_H" -lt 4 ] && [ "$MODE" = "run" ]; then
              echo "Pomijam - potok już wykonał się w tym oknie"
              MODE=skip
            fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "stale=$STALE" >> "$GITHUB_OUTPUT"
          echo "age_h=$AGE_H" >> "$GITHUB_OUTPUT"

      - name: Run tests
        if: steps.mode.outputs.mode == 'run'
        run: python -m pytest tests/ -q

      - name: Run pipeline
        if: steps.mode.outputs.mode == 'run'
        env:
          BRAVE_API_KEY:     ${{ secrets.BRAVE_API_KEY }}
          LLM_API_KEY:       ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL:      ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL:         ${{ secrets.LLM_MODEL }}
          LLM_MODEL_EXTRACT: ${{ secrets.LLM_MODEL }}
          EXTRA_DORKS:       ${{ vars.EXTRA_DORKS }}
        run: python main.py

      - name: Build docs data
        if: steps.mode.outputs.mode == 'run'
        run: python build_docs.py

      - name: Notify (Telegram + e-mail)
        if: steps.mode.outputs.mode == 'run'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST:          ${{ secrets.SMTP_HOST }}
          SMTP_PORT:          ${{ secrets.SMTP_PORT }}
          SMTP_USER:          ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:      ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL_TO:    ${{ secrets.NOTIFY_EMAIL_TO }}
        run: python notify.py

      - name: Commit results
        if: steps.mode.outputs.mode == 'run'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oferty.json stan.json data/ docs/data/ docs/nabory.ics
          git diff --cached --quiet || git commit -m "daily update [skip ci]"
          git push

      - name: Alert on stale data (Telegram)
        if: steps.mode.outputs.mode == 'run' && steps.mode.outputs.stale == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Brak sekretów Telegram - pomijam alert"
            exit 0
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="⚠️ <b>rn-dorking</b>: poprzednie okno uruchomienia nie wykonało się (dane sprzed ${{ steps.mode.outputs.age_h }} h). Potok właśnie uzupełnił dane."

      - name: Alert on failure (Telegram)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Brak sekretów Telegram - pomijam alert"
            exit 0
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="❌ &lt;b&gt;rn-dorking&lt;/b&gt;: nieudany run pipeline (&lt;a href=\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"&gt;log&lt;/a&gt;)"
