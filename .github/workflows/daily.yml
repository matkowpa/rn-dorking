name: rn-dorking daily run

on:
  schedule:
    - cron: "0 5 * * *"     # 05:00 UTC = 07:00 czasu polskiego (letniego)
    - cron: "0 17 * * *"    # 17:00 UTC = 19:00 czasu polskiego (letniego)
  workflow_dispatch:        # przycisk "Run workflow" do uruchomienia ręcznego
  push:
    paths-ignore:           # nie odpalaj przy commitach wyników bota i docs
      - "docs/**"
      - "oferty.json"
      - "stan.json"
      - "data/**"
      - "**.md"

permissions:
  contents: write           # pozwala workflow'owi robić commit wyników

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          BRAVE_API_KEY:     ${{ secrets.BRAVE_API_KEY }}
          LLM_API_KEY:       ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL:      ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL:         ${{ secrets.LLM_MODEL }}
          LLM_MODEL_EXTRACT: ${{ secrets.LLM_MODEL }}
          EXTRA_DORKS:       ${{ vars.EXTRA_DORKS }}
        run: python main.py

      - name: Build docs data
        run: python build_docs.py

      - name: Notify (Telegram + e-mail)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST:          ${{ secrets.SMTP_HOST }}
          SMTP_PORT:          ${{ secrets.SMTP_PORT }}
          SMTP_USER:          ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:      ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL_TO:    ${{ secrets.NOTIFY_EMAIL_TO }}
        run: python notify.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oferty.json stan.json data/ docs/data/
          git diff --cached --quiet || git commit -m "daily update [skip ci]"
          git push

      - name: Alert on failure (Telegram)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Brak sekretów Telegram - pomijam alert"
            exit 0
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="❌ &lt;b&gt;rn-dorking&lt;/b&gt;: nieudany run pipeline (&lt;a href=\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"&gt;log&lt;/a&gt;)"
