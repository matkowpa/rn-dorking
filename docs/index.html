<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agregator Ogłoszeń RN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/">
        <span class="logo">RN</span>
        <span class="brand-text">Agregator Ogłoszeń RN<b>Nabory do rad nadzorczych — spółki JST i Skarbu Państwa</b></span>
      </a>
      <div class="live-badge"><span class="dot"></span>Aktywne: <strong id="countBadge" class="num">0</strong></div>
    </div>
  </header>

  <main id="view" class="wrap"></main>

  <footer class="footer">
    <p>Dane zbierane automatycznie dwa razy dziennie (07:00 i 19:00) z polskich BIP-ów i stron spółek — Brave Search + LLM.</p>
  </footer>

  <!-- Licznik odwiedzin GoatCounter: bez cookies i bez danych osobowych,
       więc nie wymaga banera zgody. Kod witryny = rn-dorking (GoatCounter ->
       Settings -> Site code). Przy nieuzupełnionym kodzie (YOURCODE) app.js
       nie wysyła żadnych zdarzeń (patrz gcCount).
       Bez async celowo: app.js liczy odsłony sam (no_onload), a router startuje
       od razu, więc window.goatcounter musi być gotowe już w tym momencie. -->
  <script data-goatcounter="https://rn-dorking.goatcounter.com/count"
          data-goatcounter-settings='{"no_onload": true}'
          src="https://gc.zgo.at/count.js"></script>
  <script src="app.js"></script>
</body>
</html>
